onboarding = false

[ui.toast]
delivery = "system"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id> — note the id, not the name

[keys]

# navigation
last_pane = "prefix+shift+l"

# workspace
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# agents
focus_agent = "prefix+ctrl+1..9"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = false
